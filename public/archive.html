<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>公開檔案 · Pocket Maple</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/maple.css" />
</head>
<body>
<main>
  <header class="site"><a href="/">Pocket Maple · 口袋公聽</a><span id="state" class="hint"></span></header>
  <p class="kicker">公開檔案</p>
  <h1 id="title">載入中…</h1>
  <p class="lede" id="description"></p>
  <div id="agenda"></div>
  <p class="cta-top"><a id="testify-top" class="button" href="#">留下我的意見</a></p>
  <div class="stats" id="stats"></div>
  <div class="stance-bar" id="bar"></div>
  <div class="filters">
    <div class="seg" id="filters" role="group" aria-label="依立場篩選">
      <button type="button" data-stance="" aria-pressed="true">全部</button>
      <button type="button" data-stance="support" aria-pressed="false">支持</button>
      <button type="button" data-stance="oppose" aria-pressed="false">反對</button>
      <button type="button" data-stance="amend" aria-pressed="false">修正</button>
    </div>
    <div class="seg" id="order" role="group" aria-label="排序">
      <button type="button" data-order="new" aria-pressed="true">最新</button>
      <button type="button" data-order="old" aria-pressed="false">最早</button>
    </div>
    <input id="search" type="search" placeholder="搜尋內容或名字" style="max-width:14rem" />
  </div>
  <div id="list"></div>
  <p class="hint"><a id="testify-link" href="#">我也要留意見</a></p>
  <p id="error" class="error hidden"></p>
  <footer>證詞以留言者自填的名字公開，本站不驗證身分。法案資料來自 OpenFun 立法院 API 的快照，以立法院官方資料為準。</footer>
</main>
<script type="module" src="/archive.js"></script>
</body>
</html>
