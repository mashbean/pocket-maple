<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>留下意見 · Pocket Maple</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/maple.css" />
</head>
<body>
<main>
  <header class="site"><a href="/">Pocket Maple · 口袋公聽</a><span id="state" class="hint"></span></header>
  <p class="kicker">書面意見</p>
  <h1 id="title">載入中…</h1>
  <p class="lede" id="description"></p>
  <div id="agenda"></div>
  <section id="done" class="done-card hidden">
    <h2 id="done-title">已收到你的意見</h2>
    <p id="done-text"></p>
    <p><a id="done-link" class="button" href="#">看公開檔案裡的這一筆</a> <button id="edit-again" class="button ghost" type="button">修改</button></p>
  </section>
  <form id="form" novalidate>
    <h2 class="step"><span class="num">1</span>你的立場</h2>
    <div class="stances">
      <label class="support"><input type="radio" name="stance" value="support" /> 支持</label>
      <label class="oppose"><input type="radio" name="stance" value="oppose" /> 反對</label>
      <label class="amend"><input type="radio" name="stance" value="amend" /> 修正</label>
    </div>
    <h2 class="step"><span class="num">2</span>你是誰</h2>
    <div class="grid2">
      <div><label for="name" class="req">名字或化名<small>會公開；本站不驗證身分。</small></label><input id="name" type="text" maxlength="60" autocomplete="nickname" /></div>
      <div id="org-wrap"><label for="org">所屬單位（選填）</label><input id="org" type="text" maxlength="120" autocomplete="organization" /></div>
    </div>
    <h2 class="step"><span class="num">3</span>你的意見</h2>
    <label for="summary" id="summary-label">一句話重點<small>檔案頁與匯出會先顯示這一句。</small></label><input id="summary" type="text" maxlength="200" /><div class="counter"><span id="summary-count">0</span> / 200</div>
    <label for="text" class="req">書面意見<small>至少 20 字。可以分段，會照你的換行顯示。</small></label><textarea id="text" rows="10" maxlength="4000"></textarea><div class="counter"><span id="text-count">0</span> / 4,000</div>
    <div class="toolbar"><button id="submit" class="button" type="submit">送出意見</button><button id="withdraw" class="button ghost hidden" type="button">撤回我的意見</button><a id="archive-link" class="button ghost" href="#">看公開檔案</a></div>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </form>
  <p id="error" class="error hidden"></p>
  <footer>一台裝置一份意見，截止前可以修改或撤回。證詞以你留的名字公開存檔，標示「未驗證身分」。法案資料來自 OpenFun 立法院 API 的快照，以立法院官方資料為準。</footer>
</main>
<script type="module" src="/testify.js"></script>
</body>
</html>
